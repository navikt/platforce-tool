query ApplicationDeployments($id: ID!, $after: Cursor) {
  node(id: $id) {
    ... on Application {
      activityLog(first: 1, filter: { activityTypes: [
        DEPLOYMENT
        APPLICATION_UPDATED
        JOB_UPDATED
        GENERIC_KUBERNETES_RESOURCE_CREATED
      ] }) {
        nodes {
          createdAt
          gitHubActorClaims { repository }
        }
      }
      deployments(first: 20, after: $after) {
        pageInfo { hasNextPage endCursor }
        nodes {
          repository
          createdAt
          statuses(first: 1) { nodes { state } }
        }
      }
    }
  }
}
