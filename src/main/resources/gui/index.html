<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="shortcut icon" type="image/x-icon" href="/internal/gui/platforce.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dependency Scanner</title>
    <link rel="stylesheet" href="/internal/gui/styles.css">
</head>

<body>

<a class="skip-link" href="#main">Skip to content</a>
<header class="app-header">
    <span class="app-name">Platforce</span>
    <span class="app-description">Dependency management</span>
</header>
<main id="main" tabindex="-1">
<h1 class="visually-hidden">Dependency management</h1>
<nav class="tabs" aria-label="Main views">
    <button type="button" aria-pressed="true" aria-controls="scannerTab" id="scannerView"
            class="tab active"
            data-tab="scanner">
        Dependency Scanner
    </button>
    <button type="button" aria-pressed="false" aria-controls="targetsTab" id="targetsView"
            class="tab"
            data-tab="targets">
        Target Versions
    </button>
    <button type="button" aria-pressed="false" aria-controls="ignoredTab" id="ignoredView"
            class="tab"
            data-tab="ignored">
        Ignored
    </button>
</nav>

<section id="scannerTab" aria-labelledby="scannerView">

    <div class="toolbar">
        <button id="refreshBtn">Refresh scan</button>

        <div id="progressWrapper">
            <div id="progressText" role="status" aria-live="polite">Idle</div>
            <div class="bar" aria-hidden="true">
                <div id="progressBar"></div>
            </div>
        </div>
    </div>

    <nav id="teamTabs" class="team-tabs" aria-label="Teams"></nav>

    <div id="container"></div>
</section>

<section id="targetsTab" aria-labelledby="targetsView" style="display:none">

    <div id="targetVersionsCard" class="repo open">

        <div class="target-content">

            <div class="target-grid">

                <div>

                    <div class="target-section plugins">

                        <div class="target-section-header">
                        <h2 class="section-pill plugin-pill">
                            Plugins
                        </h2>
                        </div>
                        <div id="pluginsTable"></div>
                    </div>

                    <div class="target-section gradle">

                        <div class="target-section-header">
                        <h2 class="section-pill gradle-pill">
                            Gradle
                        </h2>
                        </div>
                        <div id="gradleTable"></div>
                    </div>

                </div>

                <div class="target-section dependencies">
                    <div class="target-section-header">
                        <h2 class="section-pill dependency-pill">
                            Dependencies
                        </h2>

                        <button id="scanTargets"
                                class="btn-secondary"
                                type="button">
                            SCAN
                        </button>

                        <span id="targetScanStatus"
                              class="target-scan-status"
                              style="display:none">
                        </span>
                    </div>

                    <div id="targetScanDetails"
                         class="target-scan-details"
                         style="display:none">
                    </div>

                    <div id="depsTable"></div>
                </div>

                <div class="target-section target-actions-section">

                    <div class="target-actions">
                        <button id="saveTargets"
                                class="btn-primary">
                            Save Target Versions
                        </button>
                    </div>

                </div>

            </div>

        </div>

    </div>
</section>

<section id="ignoredTab" aria-labelledby="ignoredView" style="display:none">
    <div id="ignoredCard" class="repo open">
        <div class="ignore-content">
            <div class="target-grid">
                <div class="target-section ignored">
                    <div class="target-section-header">
                        <h2 class="section-pill dependency-pill">
                            Ignored Repositories
                        </h2>
                    </div>
                    <div id="ignoredReposTable"></div>
                </div>
            </div>
            <div class="target-actions">
                <button id="saveIgnored" class="btn-primary">
                    Save Ignored Repositories
                </button>
            </div>
        </div>
    </div>
</section>
</main>

<script src="/internal/gui/js/state.js"></script>
<script src="/internal/gui/js/shared.js"></script>
<script src="/internal/gui/js/api.js"></script>
<script src="/internal/gui/js/scanner.js"></script>
<script src="/internal/gui/js/targets.js"></script>
<script src="/internal/gui/js/target-security.js"></script>
<script src="/internal/gui/js/scan-status.js"></script>
<script src="/internal/gui/js/ignored.js"></script>
<script src="/internal/gui/js/bootstrap.js"></script>
</body>
</html>
