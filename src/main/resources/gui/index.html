<!DOCTYPE html>
<html>
<head>
    <link rel="shortcut icon" type="image/x-icon" href="/internal/gui/platforce.png">
    <meta charset="UTF-8">
    <title>Dependency Scanner</title>
    <link rel="stylesheet" href="/internal/gui/styles.css">
</head>

<body>

<div class="tabs">
    <div
            class="tab active"
            data-tab="scanner">
        Dependency Scanner
    </div>
    <div
            class="tab"
            data-tab="targets">
        Target Versions
    </div>
    <div
            class="tab"
            data-tab="ignored">
        Ignored
    </div>
    <span class="tab-divider" aria-hidden="true"></span>
    <button class="tab" data-tab="deployments" type="button">Deployments</button>
</div>

<div id="deploymentsTab" style="display:none">
    <div class="toolbar">
        <button id="refreshDeployments" type="button">Refresh deployments</button>
        <span id="deploymentsStatus" role="status" aria-live="polite"></span>
    </div>
    <div class="deployment-refresh-marker">
        <div class="deployment-refresh-actions">
            <button id="markDeploymentsForRefresh" type="button">Mark all as needing rebuild</button>
            <button id="clearDeploymentRefreshMarker" type="button" disabled>Clear marker</button>
            <span id="deploymentRefreshMarker" role="status" aria-live="polite">Rebuild marker not loaded.</span>
            <span id="deploymentRebuildAll"></span>
        </div>
        <div id="deploymentRebuildAllFeedback" role="status" aria-live="polite" hidden></div>
        <p id="deploymentRefreshError" role="alert"></p>
    </div>
    <div id="deploymentsContainer"></div>
</div>

<div id="scannerTab">

    <div class="toolbar">
        <button id="refreshBtn">Refresh scan</button>

        <div id="progressWrapper">
            <div id="progressText">Idle</div>
            <div class="bar">
                <div id="progressBar"></div>
            </div>
        </div>
    </div>

    <div id="teamTabs" class="team-tabs"></div>

    <div id="container"></div>
</div>

<div id="targetsTab" style="display:none">

    <div id="targetSaveMessage" class="save-banner" hidden>
        <span id="targetSaveMessageText" role="status" aria-live="polite" aria-atomic="true"></span>
        <button id="closeTargetSaveMessage" class="save-banner-close" type="button" aria-label="Dismiss notification">&times;</button>
    </div>

    <div id="targetVersionsCard" class="repo open">

        <div class="target-content">

            <div class="target-grid">

                <div>

                    <div class="target-section plugins">

                        <div class="target-section-header">
                        <span class="section-pill plugin-pill">
                            Plugins
                        </span>
                        <button id="scanPlugins" class="btn-danger" type="button"
                                title="Resolve published plugin metadata without applying plugins">
                            SCAN
                        </button>
                        </div>
                        <div id="pluginScanStatus" class="target-scan-details" role="status" aria-live="polite" hidden></div>
                        <div id="pluginsTable"></div>
                    </div>

                    <div class="target-section gradle">

                        <div class="target-section-header">
                        <span class="section-pill gradle-pill">
                            Gradle
                        </span>
                        </div>
                        <div id="gradleTable"></div>
                    </div>

                    <div class="target-section platform-boms">
                        <div class="target-section-header">
                        <span class="section-pill platform-bom-pill">
                            Platform BOMs
                        </span>
                        <button id="scanBoms" class="btn-danger" type="button" disabled
                                title="Opt in to managed-version and coverage analysis for all saved BOMs">
                            SCAN
                        </button>
                        </div>
                        <div id="platformBomsTable"></div>
                    </div>

                </div>

                <div class="target-section dependencies">
                    <div class="target-section-header">
                        <span class="section-pill dependency-pill">
                            Dependencies
                        </span>

                        <button id="scanTargets"
                                class="btn-danger"
                                type="button">
                            SCAN
                        </button>

                        <span id="targetScanStatus"
                              class="target-scan-status"
                              style="display:none">
                        </span>
                        <button id="upgradeAllDependencies" class="icon-btn" type="button"
                                aria-label="Upgrade all dependencies within the current major version"
                                title="Draft the latest stable upgrades within the current major version">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
                                <path d="M8 20h8V11h5L12 3 3 11h5z"/>
                            </svg>
                        </button>
                    </div>

                    <div id="targetScanDetails"
                         class="target-scan-details"
                         style="display:none">
                    </div>

                    <div id="depsTable"></div>
                </div>

                <div class="target-section target-actions-section">

<!--                    <div class="target-section-header">
                        <span class="section-pill">
                            Actions
                        </span>
                    </div>-->

                    <div class="target-actions">
                        <button id="saveTargets"
                                class="btn-primary">
                            Save Target Versions
                        </button>
                    </div>

                </div>

            </div>

        </div>

    </div>
</div>

<div id="ignoredTab" style="display:none">
    <div id="ignoredCard" class="repo open">
        <div class="ignore-content">
            <div class="target-grid">
                <div class="target-section ignored">
                    <div class="target-section-header">
                        <span class="section-pill ignored-repositories-pill">
                            Ignored Repositories
                        </span>
                    </div>
                    <div id="ignoredReposTable"></div>
                </div>
                <div class="target-section ignored">
                    <div class="target-section-header">
                        <span class="section-pill dependency-pill">Ignored Dependencies</span>
                    </div>
                    <div id="ignoredDepsTable"></div>
                </div>
            </div>
            <div class="target-actions">
                <button id="saveIgnored" class="btn-primary">
                    Save Ignored Repositories
                </button>
            </div>
        </div>
    </div>
</div>

<script src="/internal/gui/js/state.js"></script>
<script src="/internal/gui/js/shared.js"></script>
<script src="/internal/gui/js/api.js"></script>
<script src="/internal/gui/js/scanner.js"></script>
<script src="/internal/gui/js/targets.js"></script>
<script src="/internal/gui/js/target-upgrades.js"></script>
<script src="/internal/gui/js/target-security.js"></script>
<script src="/internal/gui/js/scan-status.js"></script>
<script src="/internal/gui/js/ignored.js"></script>
<script src="/internal/gui/js/deployments.js"></script>
<script src="/internal/gui/js/bootstrap.js"></script>
</body>
</html>
